name: ziyarat-store

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - atelier_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SEED_DEMO_DATA: "false"
      ADMIN_BOOTSTRAP_LOGIN: ${ADMIN_BOOTSTRAP_LOGIN:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?set ADMIN_SESSION_SECRET}
      ADMIN_COOKIE_SECURE: "true"
      MEDIA_ROOT: /app/media
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_VIDEO_UPLOAD_BYTES: ${MAX_VIDEO_UPLOAD_BYTES:-62914560}
    volumes:
      - product_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

  web:
    build:
      context: ./apps/web
      args:
        BACKEND_INTERNAL_URL: http://api:8000
        NEXT_PUBLIC_STORE_WHATSAPP_NUMBER: ${NEXT_PUBLIC_STORE_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-}
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_STORE_WHATSAPP_NUMBER: ${NEXT_PUBLIC_STORE_WHATSAPP_NUMBER:-}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-}
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    networks:
      - public
      - backend

volumes:
  atelier_postgres_data:
  product_media:
  caddy_data:
  caddy_config:

networks:
  public:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
