name = "zvezda-admin-api"
main = "src/index.ts"
compatibility_date = "2026-09-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Bind production only after creating the D1 database. IDs are deliberately not
# committed until the Cloudflare account is chosen.
[vars]
ENVIRONMENT = "development"
ALLOWED_ORIGINS = "http://localhost:4174"
GITHUB_OWNER = "Roman391wb"
GITHUB_REPO = "zvezda-shop"
GITHUB_REF = "main"
WRITES_ENABLED = "false"

# Local-only development database. The ID is never contacted by --local and is
# deliberately not a production or staging binding.
[[d1_databases]]
binding = "DB"
database_name = "admin_v1"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[env.development]

[env.staging]
name = "zvezda-admin-api-staging"
workers_dev = true
# This branch is the sole real-write target for the Phase 2.5 integration gate.
# Keep WRITES_ENABLED false in version control; enable it only for reviewed
# live staging integration tests after the GitHub App and D1 are verified.
vars = { ENVIRONMENT = "staging", ALLOWED_ORIGINS = "https://ziyarat-admin-staging.pages.dev", GITHUB_OWNER = "Roman391wb", GITHUB_REPO = "zvezda-shop", GITHUB_REF = "admin-staging", WRITES_ENABLED = "true" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ziyarat-admin-staging"
database_id = "3b6dbce3-c001-46a6-aa94-ec0d10d81569"
migrations_dir = "migrations"

[env.production]
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://shop.example.com", GITHUB_OWNER = "Roman391wb", GITHUB_REPO = "zvezda-shop", GITHUB_REF = "main", WRITES_ENABLED = "false" }

# Required Worker secrets (set with `wrangler secret put`, never in this file):
# IP_HASH_PEPPER, GITHUB_APP_ID, GITHUB_INSTALLATION_ID,
# GITHUB_APP_PRIVATE_KEY. WRITES_ENABLED remains a non-secret "false" unless
# an explicitly reviewed environment configuration enables the pilot.
