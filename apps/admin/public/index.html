<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Управление магазином</title><link rel="stylesheet" href="/styles.css"><script src="/config.js"></script></head>
<body><main id="login" class="login"><form id="login-form"><p class="kicker">ЗАКРЫТЫЙ РАЗДЕЛ</p><h1>Управление магазином</h1><label>Логин<input name="login" autocomplete="username" required minlength="3"></label><label>Пароль<span class="password-control"><input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8"><button id="password-toggle" class="password-toggle" type="button" aria-label="Показать пароль" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.75"/></svg></button></span></label><p id="login-error" class="error" hidden></p><button>Войти</button></form></main>
<div id="app" hidden><div id="backdrop" class="backdrop" hidden></div><aside id="sidebar"><a class="brand" href="#dashboard">ZIYARAT <small>ADMIN V1</small></a><nav id="nav"></nav><button type="button" class="signout" id="logout">Выйти</button></aside><section class="shell"><header class="page-header"><button type="button" id="menu-toggle" class="menu-toggle" aria-label="Открыть меню">Меню</button><div><p class="kicker" id="role"></p><h1 id="title">Главная</h1></div><span id="status" role="status"></span></header><div id="view"></div></section></div><dialog id="confirm-dialog"><div class="dialog-body"><h2 id="confirm-title">Подтвердите действие</h2><div id="confirm-summary"></div><div class="dialog-actions"><button type="button" id="confirm-cancel" class="secondary">Отмена</button><button type="button" id="confirm-execute">Подтвердить</button></div></div></dialog><script type="module" src="/app.js"></script></body></html>
