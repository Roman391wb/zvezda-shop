[project]
name = "atelier-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.43",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "pydantic-settings==2.10.1",
  "bcrypt==4.3.0",
  "pillow==11.3.0",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
]
[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "httpx==0.28.1", "ruff==0.12.11", "mypy==1.17.1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
[tool.ruff]
line-length = 100
[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
